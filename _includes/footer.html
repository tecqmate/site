

<footer class="footer mt-auto py-4 bg-dark text-white border-top border-secondary">
    <div class="container">
        <div class="row align-items-center">
            
            <!-- Column 1: Copyright & Brand -->
            <div class="col-md-4 text-center text-md-start mb-3 mb-md-0">
                <h5 class="text-white h6 mb-1">Tecq Mate</h5>
                <p class="text-white-50 small mb-0">Copyright &copy; 2011. All rights reserved.</p>
            </div>

            <!-- Column 2: Main Navigation Links -->
            <div class="col-md-4 text-center mb-3 mb-md-0">
                <h6 class="text-uppercase text-white small fw-bold mb-2">Navigation</h6>
                <ul class="list-unstyled mb-0 small">
                    {% for menu in site.data.menus %}
                    <li class="mb-1">
                        <a 
                            href="{% if menu.external %} {{ menu.url }} {% else %} {{ menu.url | relative_url }} {% endif %}" 
                            class="text-white-50 text-decoration-none" 
                            {% if menu.external %} target="_blank" rel="noopener" {% endif %}>{{ menu.name }}</a>
                    </li>
                    {% endfor %}
                </ul>
            </div>

            <!-- Column 3: Tools & Resources Links -->
            <div class="col-md-4 text-center text-md-end">
                <h6 class="text-uppercase text-white small fw-bold mb-2">Others</h6>
                <ul class="list-unstyled mb-0 small">
                    {% for menu in site.data.links %}
                    <li class="mb-1">
                        <a 
                            href="{% if menu.external %} {{ menu.url }} {% else %} {{ menu.url | relative_url }} {% endif %}" 
                            class="text-white-50 text-decoration-none" 
                            {% if menu.external %} target="_blank" rel="noopener" {% endif %}>{{ menu.name }}</a>
                    </li>
                    {% endfor %}
                </ul>
            </div>

        </div>
    </div>
</footer>

<!-- Dynamic External styles Files Injection -->
{% if page.styles %}
  {% for style in page.styles %}
    <style rel="stylesheet" href="{{ style | relative_url }}?v={{ date: '%s' }}"/>
  {% endfor %}
{% endif %}

<!-- Scripts -->
<script src="{{ '/assets/js/jquery-3.5.0.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/bootstrap.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/bootbox.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/script.js' | relative_url }}?_={{date: '%s' }}"></script>
<script>
    function changeTheme(themeUrl) {
        $('#theme-style').attr('href', themeUrl);
        localStorage.setItem('selected-theme', themeUrl);
    }

    function toggleTheme() {
        if (document.documentElement.getAttribute('data-theme') === 'dark') {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('mode', 'light');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('mode', 'dark');
        }
    }

    $(function () {
        const savedTheme = localStorage.getItem('selected-theme');
        if (savedTheme) $('#theme-style').attr('href', savedTheme);

        const savedMode = localStorage.getItem('mode');
        if (savedMode === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    });
</script>

<!-- Dynamic External Script Files Injection -->
{% if page.scripts %}
  {% for script in page.scripts %}
    <script src="{{ script | relative_url }}?v={{ date: '%s' }}"></script>
  {% endfor %}
{% endif %}

<!-- Dynamic Inline Script Code Block Injection -->
{% if page.inline_scripts %}
  <script>
    {% for code_block in page.inline_scripts %}
      {{ code_block }}
    {% endfor %}
  </script>
{% endif %}
