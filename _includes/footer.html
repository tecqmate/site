<script src="{{ '/script.js' | relative_url }}?_=0.0.1"></script>
<script>
    function changeTheme(themeUrl) {
        $('#theme-style').attr('href', themeUrl);
        localStorage.setItem('selected-theme', themeUrl);
    }

    function toggleTheme() {
        if (document.documentElement.getAttribute('data-theme') === 'dark') {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('mode', 'light');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('mode', 'dark');
        }
    }

    $(function () {
        const savedTheme = localStorage.getItem('selected-theme');
        if (savedTheme) $('#theme-style').attr('href', savedTheme);

        const savedMode = localStorage.getItem('mode');
        if (savedMode === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    });
</script>
