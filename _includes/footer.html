<footer class="footer mt-auto py-3 bg-dark text-white">
    <div class="container text-center my-2">
        <!-- Footer Navigation Links -->
        <ul class="list-inline mb-2">
            {% for menu in site.data.menus %}
                <li class="list-inline-item">
                {% if menu.external %}
                    <a href="{{ menu.url }}" target="_blank" rel="noopener">{{ menu.name }}</a>
                {% else %}
                    <a href="{{ menu.url | relative_url }}">{{ menu.name }}</a>
                {% endif %}
                </li>
                <li class="list-inline-item text-muted">&bull;</li>
            {% endfor %}
        </ul>

        <!-- Copyright Notice -->
        <p class="m-0 text-white-50 small">Copyright &copy; Tecq Mate 2011</p>
    </div>
</footer>
<!-- Scripts -->
<script src="{{ '/assets/js/jquery-3.5.0.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/bootstrap.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/bootbox.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/script.js' | relative_url }}?_=0.0.1"></script>
<script>
    function changeTheme(themeUrl) {
        $('#theme-style').attr('href', themeUrl);
        localStorage.setItem('selected-theme', themeUrl);
    }

    function toggleTheme() {
        if (document.documentElement.getAttribute('data-theme') === 'dark') {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('mode', 'light');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('mode', 'dark');
        }
    }

    $(function () {
        const savedTheme = localStorage.getItem('selected-theme');
        if (savedTheme) $('#theme-style').attr('href', savedTheme);

        const savedMode = localStorage.getItem('mode');
        if (savedMode === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    });
</script>
