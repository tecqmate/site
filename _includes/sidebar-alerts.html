<div class="card mb-4 shadow-sm border-0">
  <div class="card-header fw-bold small text-uppercase">
    System Alert &amp; Updates
  </div>
  <div class="card-body">
    <div class="alert alert-outline-primary mb-0 p-2 small" role="alert">
      <strong>New Post:</strong> <a href="{{ site.posts.first.url | relative_url }}" class="alert-link">{{ site.posts.first.title }}</a>.
    </div>
  </div>
</div>
