{% assign global_build_hash = site.time | date: '%s' %}

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <!-- Prevents browser caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta name="google-site-verification" content="K2uHVNxSlEl-EI9hhq_pysepsylcGy3y2oe5ifn8CaA" />
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta name="keywords" content="coding, technology, tutorials, programming, development, php, javascript, python, java, web development" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="75x75" />
  
  <!-- Bootstrap & Custom Styles -->
  <link href="{{ '/assets/css/lumen.min.css' | relative_url }}" rel="stylesheet" id="theme-style">
  <link href="{{ '/assets/css/style.css' | relative_url }}?_={{global_build_hash }}" rel="stylesheet">
  
  <style>
    textarea#txt, textarea#esc {
      resize: none;
      min-height: 200px;
    }
  </style>
</head>
