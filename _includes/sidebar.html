<div class="grid gap-6 md:grid-cols-2 xl:block xl:space-y-6">
  {% include disclaimer.html %}

  {% include sidebar-ads.html %}

  {% include sidebar-alerts.html %}

  <div class="surface-card overflow-hidden">
    <div class="border-b border-slate-200 bg-slate-50 px-5 py-3 text-xs font-bold uppercase tracking-[0.16em] text-slate-700 dark:border-slate-800 dark:bg-slate-800/50 dark:text-slate-200">
      Tools &amp; Services
    </div>
    <div class="grid grid-cols-2 gap-x-3 gap-y-2.5 p-5 text-sm">
      {% for item in site.data.services %}
      <a href="{% if item.external %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}"
        class="text-brand-700 transition hover:underline dark:text-brand-300" {% if item.external %}target="_blank" rel="noopener"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </div>
  </div>

  <div class="surface-card overflow-hidden">
    <div class="border-b border-slate-200 bg-slate-50 px-5 py-3 text-xs font-bold uppercase tracking-[0.16em] text-slate-700 dark:border-slate-800 dark:bg-slate-800/50 dark:text-slate-200">
      Appearance
    </div>
    <div class="p-5">
      <p class="mb-3 text-xs leading-relaxed text-slate-500 dark:text-slate-400">Choose how Tecqmate looks on this device.</p>
      <div class="grid grid-cols-3 gap-1 rounded-xl bg-slate-100 p-1 dark:bg-slate-800" role="group" aria-label="Colour theme">
        <button type="button" data-theme-choice="light" aria-pressed="false" class="rounded-lg px-2 py-2 text-xs font-semibold text-slate-600 transition hover:text-slate-900 dark:text-slate-300 dark:hover:text-white">Light</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" class="rounded-lg px-2 py-2 text-xs font-semibold text-slate-600 transition hover:text-slate-900 dark:text-slate-300 dark:hover:text-white">Dark</button>
        <button type="button" data-theme-choice="system" aria-pressed="false" class="rounded-lg px-2 py-2 text-xs font-semibold text-slate-600 transition hover:text-slate-900 dark:text-slate-300 dark:hover:text-white">System</button>
      </div>
    </div>
  </div>

  {% include sidebar-donations.html %}
</div>
