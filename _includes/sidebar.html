<!-- Services Widget -->
<div class="card mb-4">
    <div class="card-header bg-dark text-white">Services</div>
    <div class="card-body">
        <div class="row">
            {% for item in site.data.services %}
            <div class="col-sm-6">
                {% if item.external %}
                <a href="{{ item.url }}" target="_blank" rel="noopener">{{ item.name }}</a>
                {% else %}
                <a href="{{ item.url | relative_url }}">{{ item.name }}</a>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<div class="card mb-4">
    <div class="card-header bg-dark text-white">Site Theme</div>
    <div class="card-body">
        <div class="row">
            <div class="col-sm-6"><a href="#!" onclick="changeTheme('{{ '/assets/css/yeti.min.css' | relative_url }}')">Yeti</a>
            </div>
            <div class="col-sm-6"><a href="#!"
                    onclick="changeTheme('{{ '/assets/css/united.min.css' | relative_url }}')">United</a></div>
            <div class="col-sm-6"><a href="#!" onclick="changeTheme('{{ '/assets/css/lumen.min.css' | relative_url }}')">Lumen</a>
            </div>
            <div class="col-sm-6"><a href="#!"
                    onclick="changeTheme('{{ '/assets/css/sketchy.min.css' | relative_url }}')">Sketchy</a></div>
        </div>
    </div>
</div>
