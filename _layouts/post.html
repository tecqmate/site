---
layout: home
---
<!-- Back to Blog Link Top -->
<div class="mb-3">
  <a href="{{ '/blog/' | relative_url }}" class="btn btn-outline-primary btn-sm">&larr; Back to Blog Archive</a>
</div>
<!-- Optional Cover Image -->
{% if page.image %}
<div class="mb-4">
  <img src="{{ page.image | relative_url }}" class="img-fluid rounded shadow-sm w-100" alt="{{ page.title }}">
</div>
{% endif %}

<!-- Editorial Note Partial -->
{% include editorial-note.html %}

<!-- Main Markdown Body Content -->
<div class="post-content fs-6">
  {{ content }}
</div>

<!-- Previous & Next Post Navigation Links -->
  <nav class="blog-pagination py-4 border-top border-bottom my-4">
    <div class="row align-items-center">
      <div class="col-6 text-start">
        {% if page.previous %}
          <div class="small text-muted mb-1">&larr; Older Post</div>
          <a href="{{ page.previous.url | relative_url }}" class="text-decoration-none fw-bold text-dark">
            {{ page.previous.title | truncate: 45 }}
          </a>
        {% endif %}
      </div>
      <div class="col-6 text-end">
        {% if page.next %}
          <div class="small text-muted mb-1">Newer Post &rarr;</div>
          <a href="{{ page.next.url | relative_url }}" class="text-decoration-none fw-bold text-dark">
            {{ page.next.title | truncate: 45 }}
          </a>
        {% endif %}
      </div>
    </div>
  </nav>
