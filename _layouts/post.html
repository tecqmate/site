---
layout: home
---

<article class="mb-5">
  <header class="mb-4">
    <h1 class="fw-bolder mb-1">{{ page.title }}</h1>
    <div class="text-muted fst-italic mb-2">
      Published on {{ page.date | date: '%B %d, %Y' }}
      {% if page.categories %}
        &bull; Categories: 
        {% for cat in page.categories %}
          <span class="badge bg-secondary">{{ cat }}</span>
        {% endfor %}
      {% endif %}
    </div>
  </header>

  <!-- Optional Cover Image -->
  {% if page.image %}
    <div class="mb-4">
      <img src="{{ page.image | relative_url }}" class="img-fluid rounded shadow-sm w-100" alt="{{ page.title }}">
    </div>
  {% endif %}

  <!-- Editorial Note Partial (Injected automatically, kept out of previews) -->
  {% include editorial-note.html %}

  <!-- Main Markdown Content -->
  <div class="post-content fs-6">
    {{ content }}
  </div>
</article>

<!-- SEO & Geo-AI Structured Data (JSON-LD) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ page.title | escape }}",
  "description": "{{ page.description | escape }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "{{ site.title }}"
  }
}
</script>
