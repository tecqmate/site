<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} - {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/lumen.min.css' | relative_url }}" id="theme-style">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <!-- jQuery, Bootstrap, etc. scripts -->
  <script src="{{ '/jquery-3.5.0.min.js' | relative_url }}"></script>
  <script src="{{ '/bootstrap.min.js' | relative_url }}"></script>
  <script src="{{ '/bootbox.min.js' | relative_url }}"></script>
</head>
<body>
  <!-- Navbar & Header shared code here -->
  <div class="container my-4">
    <div class="row">
      <div class="col-lg-8">
        <article>
          <h1 class="fw-bolder mb-1">{{ page.title }}</h1>
          <div class="text-muted fst-italic mb-2">Published on {{ page.date }}</div>
          {% for tag in page.tags %}
            <span class="badge bg-secondary">{{ tag }}</span>
          {% endfor %}
        </article>
        <hr class="my-4">
        {{ content }}
      </div>
      <div class="col-lg-4">
        <!-- Sidebar widgets / navigation links -->
      </div>
    </div>
  </div>
</body>
</html>
